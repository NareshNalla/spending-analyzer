<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spending Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--neg:#dc2626;--pos:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--card:#1a1d24;--tx:#e8eaed;--mut:#9aa1ad;--bd:#2b303a;--ac:#818cf8;--neg:#f87171;--pos:#4ade80}}
:root[data-theme="dark"]{--bg:#111318;--card:#1a1d24;--tx:#e8eaed;--mut:#9aa1ad;--bd:#2b303a;--ac:#818cf8;--neg:#f87171;--pos:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.drop{border:2px dashed var(--bd);text-align:center;padding:22px;cursor:pointer;color:var(--mut)}
.drop.on,.drop:hover{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;gap:12px;margin-top:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}.v{font-size:22px;font-weight:650}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer;font-size:13px}
.bar .n{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .t{flex:1;background:var(--bg);border-radius:6px;height:14px}.bar .f{height:100%;border-radius:6px}.bar .a{width:84px;text-align:right}
.bar.sel .n{font-weight:700;color:var(--ac)}
.mo{display:flex;align-items:flex-end;gap:8px;height:150px;overflow-x:auto}.mo div{flex:1;min-width:34px;text-align:center;font-size:10px;color:var(--mut)}.mo i{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:3px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools input{flex:1;min-width:180px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{cursor:pointer;font-size:11px;color:var(--mut);text-transform:uppercase;user-select:none}td.d{white-space:normal;max-width:340px}
.r{text-align:right}.neg{color:var(--neg)}.pos{color:var(--pos)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.msg{font-size:12px;color:var(--mut);margin-top:8px}.chip{background:var(--bg);border:1px solid var(--ac);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer}
</style></head><body><div class="w">
<div class="top"><div><h1>💸 Spending Analyzer</h1><div class="sub">Statements are read in your browser and saved only on this device.</div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><select id="mode" title="How to read amounts"><option value="auto">Amounts: auto</option><option value="bank">Debits negative (bank)</option><option value="card">Charges positive (card)</option></select><button id="exp">Export CSV</button><button id="clr">Clear all</button></div></div>
<div class="card drop" id="drop">📄 Drop statement PDFs (or CSV: date, description, amount) here, or click to choose<input id="file" type="file" accept=".pdf,.csv" multiple hidden><div class="msg" id="msg"></div></div>
<div id="app"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=[["Income","#16a34a",/payroll|direct dep|salary|paycheck|interest paid|refund|reversal/i],
["Transfers & Payments","#94a3b8",/zelle|venmo|paypal|cash app|transfer|autopay|payment.*thank|online payment|wire|credit card pmt|epay/i],
["Fees & Interest","#ef4444",/fee|interest charge|overdraft|finance charge/i],
["Dining","#f97316",/restaurant|cafe|coffee|starbucks|mcdonald|chipotle|pizza|doordash|uber eats|ubereats|grubhub|dunkin|subway|taco|grill|kitchen|diner|bbq|burger|bakery|biryani|wingstop|chick-fil/i],
["Groceries","#22c55e",/kroger|publix|walmart|aldi|whole foods|trader joe|costco|safeway|grocery|patel|h mart|sprouts|instacart|market/i],
["Transport & Fuel","#0ea5e9",/shell|chevron|exxon|\bbp\b|gas\b|fuel|uber|lyft|marta|parking|toll|racetrac|quiktrip|\bqt\b|citgo|mobil|peach pass/i],
["Subscriptions","#a855f7",/netflix|spotify|hulu|disney|apple\.com|itunes|google \*|youtube|openai|anthropic|claude|prime video|adobe|microsoft|subscription|patreon|icloud/i],
["Bills & Utilities","#eab308",/electric|georgia power|water|internet|comcast|xfinity|at&t|verizon|t-mobile|utility|insurance|geico|state farm|allstate|spectrum|gas co|atmos/i],
["Health","#ec4899",/cvs|walgreens|pharmacy|clinic|hospital|dental|medical|health|doctor|vision|optum|aetna|labcorp|quest diag/i],
["Housing","#14b8a6",/rent|mortgage|hoa|lease|apartment|property/i],
["Travel","#6366f1",/airline|delta|united air|southwest|american air|hotel|airbnb|marriott|hilton|expedia|booking\.com|spirit air/i],
["Entertainment","#d946ef",/amc|cinema|movie|ticketmaster|steam|game|concert|bowling/i],
["Shopping","#f43f5e",/amazon|amzn|target|best buy|ebay|etsy|home depot|lowe|ikea|nike|macy|tj maxx|marshalls|walmart|shop|store/i],
["Education","#84cc16",/tuition|school|university|udemy|coursera|book/i],
["Other","#64748b",/^$/]];
const COL=Object.fromEntries(CATS.map(c=>[c[0],c[1]]));
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const S={txns:[],rules:{},mode:'auto',q:'',cat:'',view:'tx',sk:'date',sd:-1};
const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
function save(){try{localStorage.setItem('spend_v1',JSON.stringify({t:S.txns,r:S.rules,m:S.mode}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('spend_v1')||'null');if(d){S.txns=d.t||[];S.rules=d.r||{};S.mode=d.m||'auto'}}catch(e){}}
function merchant(d){let s=d.toUpperCase().replace(/\b(POS|DEBIT|CREDIT|CARD|PURCHASE|CHECKCARD|CHECK|VISA|ACH|WITHDRAWAL|RECURRING|PMT|PAYMENT|ONLINE|TST|SQ|PP)\b/g,' ').replace(/[#*\d\/\\:.,_-]+/g,' ').replace(/\b[A-Z]{2}\b$/,'').replace(/\s+/g,' ').trim();
 s=s.split(' ').slice(0,2).join(' ')||d.slice(0,20);return s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}
function auto(d){for(const c of CATS)if(c[2].test(d))return c[0];return 'Other'}
const catOf=t=>S.rules[t.m]||auto(t.desc);
function mode(){if(S.mode!=='auto')return S.mode;return S.txns.some(t=>t.raw<0)?'bank':'card'}
const flow=t=>mode()==='bank'?t.raw:-t.raw;
function iso(s,yr){s=s.trim();let m;
 if(m=s.match(/^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?$/)){let y=m[3]?+m[3]:yr;if(y<100)y+=2000;return ok(y,+m[1],+m[2])}
 if(m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2})(?:,? (\d{4}))?$/)){return ok(m[3]?+m[3]:yr,MON[m[1].toLowerCase()],+m[2])}
 if(m=s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*(?:[- ,]+(\d{2,4}))?$/)){let y=m[3]?+m[3]:yr;if(y<100)y+=2000;return ok(y,MON[m[2].toLowerCase()],+m[1])}
 return null}
function ok(y,mo,d){return mo>=1&&mo<=12&&d>=1&&d<=31?`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`:null}
const DATE=/^(\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?|[A-Za-z]{3}[a-z]*\.? \d{1,2}(?:,? \d{4})?|\d{1,2}[- ][A-Za-z]{3}(?:[- ,]+\d{2,4})?)\s+(.*)$/;
const AMT=/(?<![\w.])\(?[-+]?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?(?:\s?(?:CR|DB|DR))?(?![\w])/gi;
const SKIP=/(beginning|ending|opening|closing|previous|new|available) balance|total|summary|credit limit|minimum payment/i;
function amt(tok){const neg=/[-(]/.test(tok)||/DR|DB/i.test(tok);const v=parseFloat(tok.replace(/[^\d.]/g,''));return neg?-v:v}
function parseLines(lines,yr){const out=[];for(const ln of lines){if(SKIP.test(ln))continue;const m=ln.match(DATE);if(!m)continue;
 let rest=m[2];const mm=rest.match(/^(\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?)\s+(.*)$/);if(mm)rest=mm[2]; // posting date
 const am=rest.match(AMT);if(!am)continue;const pick=am.length<=2?am[0]:am[am.length-2];
 const date=iso(m[1],yr);if(!date)continue;
 let desc=rest.replace(AMT,' ').replace(/\s+/g,' ').trim();if(desc.length<2)continue;
 out.push({date,desc,raw:amt(pick)})}return out}
async function readPdf(f){const buf=await f.arrayBuffer();pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:buf}).promise;const lines=[];
 for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent();const rows=[];
  for(const it of tc.items){if(!it.str.trim())continue;const y=it.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,it:[]};rows.push(r)}r.it.push({x:it.transform[4],s:it.str})}
  rows.sort((a,b)=>b.y-a.y).forEach(r=>lines.push(r.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()))}
 const ym=lines.join(' ').match(/\b(20\d{2})\b/);return parseLines(lines,ym?+ym[1]:new Date().getFullYear())}
function readCsv(t){const lines=t.split(/\r?\n/).filter(Boolean).map(l=>{const c=l.split(',').map(x=>x.replace(/^"|"$/g,'').trim());const d=iso(c[0],new Date().getFullYear());const a=parseFloat((c[c.length-1]||'').replace(/[$,]/g,''));
 return d&&!isNaN(a)?{date:d,desc:c.slice(1,-1).join(' ')||'Unknown',raw:a}:null}).filter(Boolean);return lines}
async function ingest(files){const msg=$('#msg');let added=0;
 for(const f of files){msg.textContent='Reading '+f.name+'…';try{
  const rows=/\.csv$/i.test(f.name)?readCsv(await f.text()):await readPdf(f);
  if(!rows.length){msg.textContent=`No transactions found in ${f.name} (scanned image PDFs aren't supported; try CSV).`;continue}
  const seen=new Set(S.txns.map(t=>t.date+t.desc+t.raw));
  for(const r of rows){const k=r.date+r.desc+r.raw;if(seen.has(k))continue;seen.add(k);S.txns.push({...r,m:merchant(r.desc),file:f.name});added++}
 }catch(e){msg.textContent='Could not read '+f.name+': '+e.message;return}}
 msg.textContent=`Added ${added} transactions.`;save();render()}
function view(){const q=S.q.toLowerCase();return S.txns.map(t=>({...t,c:catOf(t),f:flow(t)})).filter(t=>(!S.cat||t.c===S.cat)&&(!q||(t.desc+' '+t.m+' '+t.c).toLowerCase().includes(q)))}
const isSpend=t=>t.f<0&&t.c!=='Transfers & Payments',isInc=t=>t.f>0&&t.c!=='Transfers & Payments';
function render(){const A=$('#app');if(!S.txns.length){A.innerHTML='<div class="msg" style="text-align:center;margin-top:24px">No data yet — upload a statement to begin.</div>';return}
 const all=S.txns.map(t=>({...t,c:catOf(t),f:flow(t)})),sp=all.filter(isSpend),inc=all.filter(isInc);
 const tot=sp.reduce((a,t)=>a-t.f,0),ti=inc.reduce((a,t)=>a+t.f,0);
 const bc={};sp.forEach(t=>bc[t.c]=(bc[t.c]||0)-t.f);const cats=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
 const bm={};sp.forEach(t=>{const k=t.date.slice(0,7);bm[k]=(bm[k]||0)-t.f});const ms=Object.entries(bm).sort();const mx=Math.max(...ms.map(x=>x[1]),1);
 const rows=view();
 let body;
 if(S.view==='tx'){const k=S.sk,d=S.sd;rows.sort((a,b)=>{const x=k==='f'?a.f:a[k],y=k==='f'?b.f:b[k];return (x>y?1:x<y?-1:0)*d});
  body=`<table><tr>${[['date','Date'],['desc','Description'],['m','Merchant'],['c','Category'],['f','Amount']].map(([k,l])=>`<th data-s="${k}" class="${k==='f'?'r':''}">${l}${S.sk===k?(S.sd>0?' ▲':' ▼'):''}</th>`).join('')}</tr>`+
  rows.map(t=>`<tr><td>${t.date}</td><td class="d">${esc(t.desc)}</td><td>${esc(t.m)}</td><td><span class="dot" style="background:${COL[t.c]}"></span><select data-m="${esc(t.m)}">${CATS.map(c=>`<option${c[0]===t.c?' selected':''}>${c[0]}</option>`).join('')}</select></td><td class="r ${t.f<0?'neg':'pos'}">${fmt(t.f)}</td></tr>`).join('')+'</table>'}
 else{const g={};rows.forEach(t=>{const o=g[t.m]||(g[t.m]={m:t.m,n:0,s:0,c:t.c});o.n++;o.s+=t.f});
  body='<table><tr><th>Merchant</th><th>Category</th><th class="r">Count</th><th class="r">Net</th></tr>'+Object.values(g).sort((a,b)=>a.s-b.s).map(o=>`<tr><td><a href="#" data-q="${esc(o.m)}" style="color:var(--ac)">${esc(o.m)}</a></td><td><span class="dot" style="background:${COL[o.c]}"></span>${o.c}</td><td class="r">${o.n}</td><td class="r ${o.s<0?'neg':'pos'}">${fmt(o.s)}</td></tr>`).join('')+'</table>'}
 A.innerHTML=`<div class="grid g4"><div class="card"><div class="k">Spending</div><div class="v neg">${fmt(tot)}</div></div><div class="card"><div class="k">Income</div><div class="v pos">${fmt(ti)}</div></div><div class="card"><div class="k">Transactions</div><div class="v">${all.length}</div></div><div class="card"><div class="k">Top category</div><div class="v" style="font-size:17px">${cats[0]?cats[0][0]:'—'}</div></div></div>
 <div class="grid g2"><div class="card"><div class="k" style="margin-bottom:6px">Spending by category (click to filter)</div>${cats.map(([c,v])=>`<div class="bar${S.cat===c?' sel':''}" data-c="${c}"><span class="n">${c}</span><span class="t"><div class="f" style="width:${v/cats[0][1]*100}%;background:${COL[c]}"></div></span><span class="a">${fmt(v)}</span></div>`).join('')}</div>
 <div class="card"><div class="k" style="margin-bottom:6px">Spending by month</div><div class="mo">${ms.map(([m,v])=>`<div><i style="height:${v/mx*110}px"></i>${fmt(v).replace('.00','')}<br>${m}</div>`).join('')}</div></div></div>
 <div class="tools"><input id="q" placeholder="Search description, merchant, category…" value="${esc(S.q)}"><button id="vw">${S.view==='tx'?'Group by merchant':'Show transactions'}</button>${S.cat?`<span class="chip" id="xc">${S.cat} ✕</span>`:''}<span class="sub" style="align-self:center">${rows.length} shown</span></div>
 <div class="card tw">${body}</div><div class="msg">Change a category on any row to re-group every payment from that merchant. Transfers & card payments are excluded from totals.</div>`;
 $('#mode').value=S.mode;
 $('#q').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)};
 $('#vw').onclick=()=>{S.view=S.view==='tx'?'mer':'tx';render()};
 const xc=$('#xc');if(xc)xc.onclick=()=>{S.cat='';render()};
 A.querySelectorAll('.bar').forEach(b=>b.onclick=()=>{S.cat=S.cat===b.dataset.c?'':b.dataset.c;render()});
 A.querySelectorAll('th[data-s]').forEach(h=>h.onclick=()=>{const k=h.dataset.s;S.sd=S.sk===k?-S.sd:1;S.sk=k;render()});
 A.querySelectorAll('select[data-m]').forEach(s=>s.onchange=()=>{S.rules[s.dataset.m]=s.value;save();render()});
 A.querySelectorAll('a[data-q]').forEach(a=>a.onclick=e=>{e.preventDefault();S.q=a.dataset.q;S.view='tx';render()})}
const drop=$('#drop'),fi=$('#file');
drop.onclick=()=>fi.click();fi.onchange=()=>{ingest([...fi.files]);fi.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');ingest([...e.dataTransfer.files])};
$('#mode').onchange=e=>{S.mode=e.target.value;save();render()};
$('#clr').onclick=()=>{if(confirm('Delete all stored transactions and custom categories?')){S.txns=[];S.rules={};save();render()}};
$('#exp').onclick=()=>{const r=['Date,Description,Merchant,Category,Amount',...view().map(t=>[t.date,`"${t.desc.replace(/"/g,'""')}"`,t.m,t.c,t.f.toFixed(2)].join(','))];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.join('\n')],{type:'text/csv'}));a.download='transactions.csv';a.click()};
load();render();
</script></body></html>
